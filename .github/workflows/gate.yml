# 服务端门禁：GitHub Actions 上的「不可绕过层」。
# 六个必需 job 名是 main 规则集（15828446）的契约，改名/增删必须同步规则集；coverage 是报告型、非必需。
# 本地复现：sh scripts/tests/run.sh、sh scripts/checks/format.sh ci。判定入口在 scripts/checks/ 与 scripts/tests/。

name: 门禁

on:
  pull_request: # 含草稿 PR
  push:
    branches: [main]

# 只读权限、不用 secret、不用 pull_request_target：fork 的 PR 会执行本编排。
permissions:
  contents: read

# 同一 PR 的新推送取消旧运行。
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 23.1.x 来自 apt.llvm.org noble-23；工具校验直接命中这一份。
  CLANG_ROOT: /usr/lib/llvm-23/bin
  # baseline 那一份 vcpkg；构建与静态检查 job 共用。
  VCPKG_ROOT: /home/runner/vcpkg

jobs:
  # 缓存键只在这里算：baseline + manifest + triplet + 镜像 + clang 前缀。
  # 不用 restore-keys：键不匹配就干净冷编译，避免「这次为什么慢」不可解释。
  cache-key:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: 算缓存键（并写进日志，便于事后判断「为什么没命中」）
        id: key
        run: |
          prefix=$(bash scripts/ci/setup-linux.sh --clang-prefix)
          baseline=$(bash scripts/ci/setup-linux.sh --vcpkg-baseline)
          manifest=$(sha256sum vcpkg.json | cut -c1-16)
          # triplet 固定 x64-linux：Linux Debug 预设用的就是它（CMakePresets.json 的 linux-base）。
          key="vcpkg-${baseline}-manifest${manifest}-x64-linux-${ImageOS:-unknown}-${ImageVersion:-unknown}-clang${prefix}"
          printf '缓存键：%s\n' "${key}"
          printf 'key=%s\n' "${key}" >> "$GITHUB_OUTPUT"

  # 门禁机制在干净 Linux 机器上成立：无依赖、秒级。
  hooks-self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 装 23.1.x 的 clang 工具链
        run: bash scripts/ci/setup-linux.sh llvm
      - name: 在临时仓库里跑真钩子，断言退出码与 stderr
        run: sh scripts/tests/hooks.sh

  # 检查入口 CLI 契约自测：无依赖、秒级。
  checks-self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 装 23.1.x 的 clang 工具链
        run: bash scripts/ci/setup-linux.sh llvm
      - name: 检查入口 CLI 契约自测
        run: sh scripts/tests/checks.sh
      - name: 契约检查（C17 / AsyncAPI / OpenAPI）
        run: sh scripts/checks/contracts.sh

  # 只查本次变更范围；全仓会让 CI 常年飘红。
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 变更范围是 base...head，需要 base 那一侧的提交
      - name: 装 23.1.x 的 clang 工具链
        run: bash scripts/ci/setup-linux.sh llvm
      - name: 格式检查（只查本次变更范围，判定逻辑在 scripts/checks/format.sh）
        run: sh scripts/checks/format.sh ci

  # 真构建 + 产物契约：Server 的目标平台是 Ubuntu。
  # 缓存未命中时要从源码编 ffmpeg/glfw3/vulkan；实测 845 秒，命中 77 秒（见 ADR 0006 决策 5）。
  build-linux-debug:
    needs: cache-key
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 还原 vcpkg 二进制缓存（命中就不必再从源码编依赖）
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          # .vcpkg-cache 是仓库自己的二进制缓存位置（VCPKG_BINARY_SOURCES），downloads 是 vcpkg 的源码包缓存。
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 装前置（clang 23.1.x / cmake 4.x / Linux 系统开发包 / vcpkg）
        run: bash scripts/ci/setup-linux.sh llvm cmake system vcpkg
      - name: 配置（linux-clang-x64-Debug：产出编译数据库与 vcpkg 依赖安装树）
        run: bash scripts/ci/preset-linux-debug.sh configure
      # 显式保存并 if: always()：job 失败时不会自动保存；「依赖刚编完」的中间状态最值得复用。
      - name: 保存 vcpkg 二进制缓存（键已存在则跳过）
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 构建
        run: bash scripts/ci/preset-linux-debug.sh build
      - name: 产物契约断言（体积 / 导出数量 / 不含 libc++）
        run: bash scripts/ci/preset-linux-debug.sh verify

  # 静态检查：与本地 pre-push 同一份判定（scripts/checks/tidy.sh）。
  # needs build-linux-debug 保证编译数据库与头文件树就绪；不用 artifact 传（头文件树 537 MB vs 库 1 MB）。
  tidy:
    needs: [cache-key, build-linux-debug]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 变更范围是 base...head
      - name: 还原 vcpkg 二进制缓存（这个 job 自己配置一次，同样靠缓存才快）
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 装前置（clang 23.1.x / cmake 4.x / Linux 系统开发包 / vcpkg）
        run: bash scripts/ci/setup-linux.sh llvm cmake system vcpkg
      - name: 配置（静态检查需要编译数据库与依赖头文件树）
        run: bash scripts/ci/preset-linux-debug.sh configure
      - name: 保存 vcpkg 二进制缓存（失败也留；键已存在则跳过）
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 静态检查（scripts/checks/tidy.sh —— 与本地 pre-push 同一份判定）
        run: sh scripts/checks/tidy.sh build/Linux/debug ci

  # 测试接入点：没有注册用例时明确 SKIP，不静默绿灯。
  ctest:
    needs: [cache-key, build-linux-debug]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 还原 vcpkg 二进制缓存
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 装前置（clang 23.1.x / cmake 4.x / Linux 系统开发包 / vcpkg）
        run: bash scripts/ci/setup-linux.sh llvm cmake system vcpkg
      - name: 配置（测试清单来自配置阶段产出的 CTestTestfile.cmake）
        run: bash scripts/ci/preset-linux-debug.sh configure
      - name: 保存 vcpkg 二进制缓存（失败也留；键已存在则跳过）
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 构建（现在没有测试目标；#54 把 test/ 接回根构建后这一步才会产出测试二进制）
        run: bash scripts/ci/preset-linux-debug.sh build
      - name: 跑测试（没有注册用例时明确 SKIP，判定在 scripts/checks/ctest.sh）
        run: sh scripts/checks/ctest.sh build/Linux/debug

  # 覆盖率报告：构建 → ctest → llvm-cov，产出 coverage-report.txt。
  # 只出数字、不设阈值、不阻断，因此不是必需检查（规则集只要求上面六个 job）。
  coverage:
    needs: [cache-key, build-linux-debug]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 还原 vcpkg 二进制缓存
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 装前置（clang 23.1.x / cmake 4.x / Linux 系统开发包 / vcpkg / llvm-cov）
        run: bash scripts/ci/setup-linux.sh llvm coverage cmake system vcpkg
      - name: 构建、跑测试并生成覆盖率报告（scripts/build/coverage.sh）
        run: bash scripts/build/coverage.sh
      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/Linux/coverage/coverage-report.txt
          if-no-files-found: error
