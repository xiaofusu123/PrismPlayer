# 服务端门禁（spec #96）：GitHub Actions 上的「不可绕过层」。
# 契约：job 名是 main 规则集里的必需检查，改名必须同步规则集，否则会静默失效（#96 决策 27 / #103）。
# 本地复现：sh test/hooks/run.sh、sh test/checks/run.sh、sh scripts/checks/format.sh ci。
# 判定逻辑一律住在 scripts/checks/ 与 test/ 下，本地钩子与 CI 调用同一份（#96 决策 6/8）。

name: 门禁

on:
  pull_request: # 含草稿 PR，便于自查（#96 决策 3/28）
  push:
    branches: [main] # 留痕：合进 main 的每一次推送也跑一遍

# 只读权限、不使用任何 secret、不用 pull_request_target（#96 决策 4）：fork 的 PR 会执行本编排。
permissions:
  contents: read

# 同一 PR 的新推送取消上一次仍在跑的运行（#96 决策 5）。
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 门禁钉死的 23.1.x 必须来自 apt.llvm.org 的 noble-23 仓，CLANG_ROOT 让工具校验直接命中这一份（#96 决策 12）。
  CLANG_ROOT: /usr/lib/llvm-23/bin
  # CI 上 vcpkg 不在成员本机的位置；取 baseline 那一份，构建与静态检查 job 共用（#99 / #100）。
  VCPKG_ROOT: /home/runner/vcpkg

jobs:
  # vcpkg 缓存键只在这一处算（#101）：baseline + manifest + triplet + 镜像 + clang 前缀。
  # 刻意不用 restore-keys 做部分命中：键不匹配就是干净冷编译，部分命中会让「这次为什么慢」不可解释。
  cache-key:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - name: 算缓存键（并写进日志，便于事后判断「为什么没命中」）
        id: key
        run: |
          prefix=$(bash scripts/ci/setup-linux.sh --clang-prefix)
          baseline=$(bash scripts/ci/setup-linux.sh --vcpkg-baseline)
          manifest=$(sha256sum vcpkg.json | cut -c1-16)
          # triplet 固定 x64-linux：Linux Debug 预设用的就是它（CMakePresets.json 的 linux-base）。
          key="vcpkg-${baseline}-manifest${manifest}-x64-linux-${ImageOS:-unknown}-${ImageVersion:-unknown}-clang${prefix}"
          printf '缓存键：%s\n' "${key}"
          printf 'key=%s\n' "${key}" >> "$GITHUB_OUTPUT"

  # 门禁机制本身在干净 Linux 机器上成立（#96 决策 20）：无依赖、秒级。
  hooks-self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 装 23.1.x 的 clang 工具链
        run: bash scripts/ci/setup-linux.sh llvm
      - name: 在临时仓库里跑真钩子，断言退出码与 stderr
        run: sh test/hooks/run.sh

  # 检查入口自己的 CLI 契约自测（#96 决策 21）：同样无依赖、秒级。
  checks-self-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 装 23.1.x 的 clang 工具链
        run: bash scripts/ci/setup-linux.sh llvm
      - name: 检查入口 CLI 契约自测
        run: sh test/checks/run.sh

  # 格式检查只查本次变更范围（#96 决策 7/10）：全仓会让 CI 从第一天起常年飘红。
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 变更范围是 base...head，需要 base 那一侧的提交
      - name: 装 23.1.x 的 clang 工具链
        run: bash scripts/ci/setup-linux.sh llvm
      - name: 格式检查（只查本次变更范围，判定逻辑在 scripts/checks/format.sh）
        run: sh scripts/checks/format.sh ci

  # 真构建（#99）：Server 的目标平台就是 Ubuntu，跑真实构建并断言产物契约。
  # 本工作流唯一「重」的 job：未命中缓存时要源码编译 ffmpeg / glfw3 / vulkan 等依赖。
  # 实测（#101）：未命中 845 秒、命中 77 秒；完整口径见 docs/adr/0006-门禁第二阶段CI.md 决策 5。
  build-linux-debug:
    needs: cache-key
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 还原 vcpkg 二进制缓存（命中就不必再从源码编依赖）
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          # .vcpkg-cache 是仓库自己的二进制缓存位置（VCPKG_BINARY_SOURCES），downloads 是 vcpkg 的源码包缓存。
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 装前置（clang 23.1.x / cmake 4.x / Linux 系统开发包 / vcpkg）
        run: bash scripts/ci/setup-linux.sh llvm cmake system vcpkg
      - name: 配置（linux-clang-x64-Debug：产出编译数据库与 vcpkg 依赖安装树）
        run: bash scripts/ci/preset-linux-debug.sh configure
      # 显式保存并 if: always()：actions/cache 自带的「job 结束保存」在 job 失败时不会发生（#101 实测）。
      # 「依赖刚编完、项目还没编」的中间状态最需要复用；键已命中就没有新东西可存。
      - name: 保存 vcpkg 二进制缓存（键已存在则跳过）
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 构建
        run: bash scripts/ci/preset-linux-debug.sh build
      - name: 产物契约断言（体积 / 导出数量 / 不含 libc++）
        run: bash scripts/ci/preset-linux-debug.sh verify

  # 静态检查（#100）：与本地 pre-push 同一份判定（scripts/checks/tidy.sh），只是范围不同。
  # 必须等 build-linux-debug：编译数据库与 vcpkg 头文件树都来自配置阶段，只靠 needs 保证先后。
  # 不用 artifact 传 compile_commands.json（依赖头文件树 537 MB vs 数据库 1 MB），见 ADR 0006「后果」。
  tidy:
    needs: [cache-key, build-linux-debug]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 变更范围是 base...head
      - name: 还原 vcpkg 二进制缓存（这个 job 自己配置一次，同样靠缓存才快）
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 装前置（clang 23.1.x / cmake 4.x / Linux 系统开发包 / vcpkg）
        run: bash scripts/ci/setup-linux.sh llvm cmake system vcpkg
      - name: 配置（静态检查需要编译数据库与依赖头文件树）
        run: bash scripts/ci/preset-linux-debug.sh configure
      - name: 保存 vcpkg 二进制缓存（失败也留；键已存在则跳过）
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 静态检查（scripts/checks/tidy.sh —— 与本地 pre-push 同一份判定）
        run: sh scripts/checks/tidy.sh build/Linux/debug ci

  # 测试接入点（#102）：这一票只做骨架与语义，`test/` 还没接回根构建。
  # 所以现在明确说「没有测试可跑」而不是静默绿灯；等 add_test() 出现，同一个 job 自动变成真检查。
  ctest:
    needs: [cache-key, build-linux-debug]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 还原 vcpkg 二进制缓存
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 装前置（clang 23.1.x / cmake 4.x / Linux 系统开发包 / vcpkg）
        run: bash scripts/ci/setup-linux.sh llvm cmake system vcpkg
      - name: 配置（测试清单来自配置阶段产出的 CTestTestfile.cmake）
        run: bash scripts/ci/preset-linux-debug.sh configure
      - name: 保存 vcpkg 二进制缓存（失败也留；键已存在则跳过）
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .vcpkg-cache
            /home/runner/vcpkg/downloads
          key: ${{ needs.cache-key.outputs.key }}
      - name: 构建（现在没有测试目标；#54 把 test/ 接回根构建后这一步才会产出测试二进制）
        run: bash scripts/ci/preset-linux-debug.sh build
      - name: 跑测试（没有注册用例时明确 SKIP，判定在 scripts/checks/ctest.sh）
        run: sh scripts/checks/ctest.sh build/Linux/debug
